<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zee.Media — Client Dashboards</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#FDFEF9;color:#2D2E27}
  @media(prefers-color-scheme:dark){body{background:#1c1d19;color:#FDFEF9}}
  .card{max-width:440px;text-align:center;line-height:1.55}
  .mark{width:40px;height:40px;border-radius:10px;margin:0 auto 18px;
    background:linear-gradient(135deg,#0C304A,#CDA434);display:grid;place-items:center;
    color:#fff;font-weight:800;font-size:20px}
  h1{font-size:20px;letter-spacing:-.02em;margin:0 0 8px}
  p{color:#8a9095;font-size:14.5px;margin:0}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">Z</div>
    <h1>Zee.Media client dashboards</h1>
    <p>Please open the dashboard link provided for your account. If you don't have one, contact your account manager.</p>
  </div>
</body>
</html>
